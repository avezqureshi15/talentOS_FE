services:
  fe:
    build:
      context: .
      args:
        VITE_BE_API_BASE_URL: ${VITE_BE_API_BASE_URL:-http://localhost:8001/api/v1}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:5173}
        VITE_SLOT_DURATION_MINUTES: ${VITE_SLOT_DURATION_MINUTES:-30}
        VITE_AI_SCAN_ANIMATION: ${VITE_AI_SCAN_ANIMATION:-}
    restart: unless-stopped
    ports:
      - "5173:80"
